<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="manifest" href="/site.webmanifest" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#050508" />
  <title>DOGS DROPS</title>
  <meta name="description" content="Limited runs, dropped live. Set the time, set the stock, watch every sale land in real time." />
</head>

<body class="bg-app text-white">
  <div id="app"></div>

  <!-- Static fallback for browsers too old to run the app (Potato Target: Chrome 40), and for no-JS visitors.
       Plain HTML only. Styles: src/styles/legacy-fallback.css. -->
  <div id="legacy-fallback" class="legacy-fallback">
    <img class="legacy-fallback__logo" src="/src/assets/dogs-logo-cropped.png" alt="DOGS dog head logo" width="540" height="534" />
    <div class="legacy-fallback__text">
      <h1 class="legacy-fallback__title">DOGS DROPS</h1>
      <p class="legacy-fallback__tagline">Limited runs, dropped live. Your browser is too old for the live room, so open this page on a newer one to buy.</p>
      <a class="legacy-fallback__badge" href="https://wearedogs.net" target="_blank" rel="noopener noreferrer">
        <img src="/src/assets/made-by-dogs-small.png" alt="This product was made by DOGS" width="480" height="159" />
      </a>
    </div>
  </div>
  <!-- Must stay ES5: this is the only script the Potato Target runs. Hides the fallback before first paint on
       browsers that can run the app (CSS cascade layers = the Tailwind v4 floor), and brings it back if the app crashes. -->
  <script>
    (function () {
      var fallback = document.getElementById('legacy-fallback');
      if (!window.CSSLayerBlockRule) return;
      fallback.setAttribute('hidden', '');
      window.addEventListener('error', function () {
        if (!document.getElementById('app').firstChild) fallback.removeAttribute('hidden');
      });
    })();
  </script>

  <script type="module" src="/src/main.js"></script>
</body>

</html>
